name: AMS CI

on:
  push:
    branches:
      - main
      - 'hardening/**'
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kapitech_ams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kapitech_ams_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run lint

      - name: Apply PostgreSQL migrations
        env:
          KAPITECH_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/kapitech_ams_test
          KAPITECH_POSTGRES_SSL: disable
        run: bun run db:migrate

      - name: Security regression tests
        run: node --import tsx --test tests/**/*.test.ts

      - name: PostgreSQL integration tests
        env:
          KAPITECH_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/kapitech_ams_test
          KAPITECH_POSTGRES_SSL: disable
        run: node --import tsx --test tests/postgres-integration.test.ts

      - name: Dependency audit
        run: bun audit --audit-level=high

      - name: Production build
        env:
          RAYON_NUM_THREADS: 1
        run: bun run build

      - name: Verify packaged PostgreSQL migrations
        run: |
          test -d dist/db/postgres
          source_count=$(find db/postgres -maxdepth 1 -type f -name '*.sql' | wc -l)
          packaged_count=$(find dist/db/postgres -maxdepth 1 -type f -name '*.sql' | wc -l)
          test "$source_count" -gt 0
          test "$source_count" = "$packaged_count"

      - name: Production HTTP smoke test
        env:
          NODE_ENV: production
          PORT: 4173
          APP_URL: https://example.invalid
          KAPITECH_DATA_SOURCE: postgres
          KAPITECH_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/kapitech_ams_test
          KAPITECH_POSTGRES_SSL: disable
          KAPITECH_DATA_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
          ADMIN_INITIAL_USERNAME: admin
          ADMIN_INITIAL_PASSWORD: smoke-test-password-123456
          ADMIN_INITIAL_EMAIL: admin@smoke.kapitech.test
        run: |
          node dist/server.cjs > /tmp/kapitech-ams-smoke.log 2>&1 &
          PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "===== AMS smoke server log ====="; cat /tmp/kapitech-ams-smoke.log || true; fi; kill $PID >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --retry 1 --retry-connrefused http://127.0.0.1:4173/api/health >/tmp/health.json 2>/tmp/health.err; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "===== AMS smoke socket diagnostic ====="
            ss -ltnp | grep ':4173' || true
            echo "===== AMS smoke curl diagnostic ====="
            curl -sS --max-time 5 -o /tmp/health-debug.json -w 'HTTP %{http_code}\\n' http://127.0.0.1:4173/api/health || true
            cat /tmp/health-debug.json 2>/dev/null || true
            echo "===== AMS smoke curl stderr ====="
            cat /tmp/health.err 2>/dev/null || true
          fi
          test "$ready" = "1"
          test -s /tmp/health.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); if(x.status!=='ok'||x.services?.dataSource!=='postgres') process.exit(1)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/api/auth/me)" = "401"
          curl -sS -D /tmp/login.headers -H 'Content-Type: application/json' --data '{"identifier":"admin","password":"smoke-test-password-123456","rememberMe":false}' http://127.0.0.1:4173/api/auth/login >/tmp/login.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/login.json','utf8')); if(!x.success||x.user?.stakeholderType!=='Master') process.exit(1)"
          node -e "const fs=require('fs'); const h=fs.readFileSync('/tmp/login.headers','utf8'); const line=h.split(/\\r?\\n/).find(x=>/^Set-Cookie:\\s*kapi_session=/i.test(x))||''; const m=line.match(/^Set-Cookie:\\s*kapi_session=([^;]+)/i); if(!m||!/(?:^|;)\\s*HttpOnly(?:;|$)/i.test(line)||!/\\bSecure(?:;|$)/i.test(line)||!/SameSite=Strict/i.test(line)) process.exit(1); fs.writeFileSync('/tmp/session-cookie.txt', m[1])"
          SESSION_COOKIE=$(cat /tmp/session-cookie.txt)
          curl -sS -H "Cookie: kapi_session=$SESSION_COOKIE" http://127.0.0.1:4173/api/auth/me >/tmp/me.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/me.json','utf8')); if(!x.success||x.user?.username!=='admin') process.exit(1)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/api/system/production-readiness)" = "401"
          readiness_status=$(curl -sS -o /tmp/readiness-auth.json -w '%{http_code}' -H "Cookie: kapi_session=$SESSION_COOKIE" http://127.0.0.1:4173/api/system/production-readiness)
          test "$readiness_status" = "403"
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/readiness-auth.json','utf8')); if(x.code!=='MFA_REQUIRED') process.exit(1)"
          kill $PID

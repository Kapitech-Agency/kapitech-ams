<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kapitech AMS | Agency Management System</title>
    <meta
      name="description"
      content="Kapitech Agency Management System."
    />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="theme-color" content="#09090c" />

    <link rel="icon" type="image/png" href="/white.png" />

    <script>
      (() => {
        try {
          const saved = localStorage.getItem('kapitech_ams_theme');
          // AMS is dark-first. Only an explicit saved choice may enable light mode.
          const theme = saved === 'light' || saved === 'dark' ? saved : 'dark';

          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?v=ams-20260930-tasks"></script>
  </body>
</html>
